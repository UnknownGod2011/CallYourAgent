name: Compose deployment

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CYA_API_TOKEN: ci-only-compose-token
      CYA_VOLUME_NAME: callyouragent-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose -f deploy/compose.yml config --quiet

      - name: Boot fake-provider deployment
        run: docker compose -f deploy/compose.yml up --build --detach

      - name: Wait for healthy runtime
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker compose -f deploy/compose.yml ps
          docker compose -f deploy/compose.yml logs
          exit 1

      - name: Verify named volume and restart-safe boot
        run: |
          docker volume inspect "$CYA_VOLUME_NAME" >/dev/null
          docker compose -f deploy/compose.yml restart callyouragent
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker compose -f deploy/compose.yml logs
          exit 1

      - name: Cleanup
        if: always()
        run: docker compose -f deploy/compose.yml down --volumes --remove-orphans
